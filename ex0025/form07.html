<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="on">

    <p>
        <label for="iest">Estado</label>
        <select name="estado" id="iest">

            <option value="" selected>---Escolher---</option>
<optgroup label="Região Nort">
    
            <option value="LD">Luanda</option>
            <option value="ZR">Zaíre</option>
            <option value="UG">Úige</option>
</optgroup>


        <optgroup label="Região Sul">
            <option value="HB">Huambo</option>
            <option value="BG">Bebeguela</option>
            <option value="MX">Moxico</option>
        </optgroup>

        </select>
    </p>

<p>
<label for="iprof">Profissão</label>
<input type="text" name="prof" id="iprof" list="lstprof">
<datalist id="lstprof">
    <option>Administrador</option>
     <option>Contabilísta</option>
      <option>Desenvolvedor</option>
       <option>Professor</option>
</datalist>

</p>

<p>
<label for="imsg">Mensagem</label>
<textarea name="mensagem" id="imsg" cols="30" rows="10"></textarea>

</p>


<p>
   <input type="submit" value="Enviar"> 
   <input type="reset" value="Limpar">

</p>

</form>
</body>
</html>
