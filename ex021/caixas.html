<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /* box-level */
            background-color:rgba(128, 128, 128, 0.418) ;
            height: 300px;
            width: 300px;
           /* simplificando nós temos, border: 10px solid green */
            border-width: 10px;
            border-style:solid;
            border-color:green;

            /* aqui também temos. paddin: 10px 10px 10px */
padding-top: 10px;
padding-right: 10px;
padding-bottom: 10px;
padding-left: 10px;

margin-top: 10px;
margin-right: 10px;
margin-bottom: 10px;
margin-left: 10px;

/* outline: 5px  dashed blue */
outline-width: 5px;
outline-style: dashed;
outline-color: blue;


 }

a{/* inlinelevel */
     border-width: 10px;
            border-style:solid;
            border-color:red;
}
    </style>
</head>
<body>
    <h1>Exemplo de caixas Box-level</h1>

<p>paragrafos também são exemplos de box-level, mas <a href="#">mas os links são exemlpos de modelos de caixas inlevel </a> vamos ver como tudo isso funciona</p>
